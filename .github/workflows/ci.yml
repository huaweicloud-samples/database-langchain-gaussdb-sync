name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,dev]"
      - name: Compile
        run: python -m compileall -q langchain_gaussdb tests
      - name: Lint
        run: python -m ruff check langchain_gaussdb tests
      - name: Format
        run: python -m ruff format --check langchain_gaussdb tests
      - name: Type check
        run: python -m mypy langchain_gaussdb
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Collect E2E suite
        run: python -m pytest tests/e2e --collect-only -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Build and check
        run: python -m build && python -m twine check dist/*
