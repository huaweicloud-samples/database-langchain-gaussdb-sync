[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "database-langchain-gaussdb-sync"
version = "0.1.0"
description = "Synchronous psycopg2-based LangChain integration for GaussDB vector search and chat message history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "langchain-core>=1.1.0,<2.0.0",
    "numpy>=1.26,<3.0",
    "psycopg2-binary>=2.9.9,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "langchain-tests==1.1.9",
    "tomli>=2.0,<3.0; python_version < '3.11'",
    "setuptools>=77",
    "wheel>=0.45",
]
dev = [
    "build>=1.2,<2.0",
    "mypy>=1.15,<2.0",
    "ruff>=0.15,<0.16",
    "twine>=6.0,<7.0",
    "types-psycopg2>=2.9.21,<3.0",
]

[tool.setuptools.packages.find]
include = ["langchain_gaussdb*"]
exclude = [
    "tests*",
    "sr-design*",
    "docs*",
    "scripts*",
    "_official*",
    "_tmp*",
]

[tool.setuptools.package-data]
langchain_gaussdb = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["langchain_gaussdb"]

[tool.coverage.report]
show_missing = true
skip_covered = false
