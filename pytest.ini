[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    gaussdb_e2e: tests that require a real GaussDB instance via GAUSSDB_TEST_DSN
    gaussdb_e2e_fast: deterministic real-DB smoke subset
    gaussdb_e2e_full: complete finite-state real-DB matrix
    gaussdb_e2e_exhaustive: race, cancellation, repetition, and exhaustive topology
    gaussdb_wheel_quickstart: isolated built-wheel import and quickstart
